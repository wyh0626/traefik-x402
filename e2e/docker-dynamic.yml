http:
  routers:
    paid-api:
      entryPoints:
        - web
      rule: Path(`/protected`)
      service: mock-upstream
      middlewares:
        - x402-payment

  services:
    mock-upstream:
      loadBalancer:
        servers:
          - url: http://mock:19090

  middlewares:
    x402-payment:
      plugin:
        x402:
          facilitatorURL: http://mock:19090
          allowInsecureFacilitator: true
          scheme: exact
          network: "eip155:84532"
          asset: "0x036CbD53842c5426634e7929541eC2318f3dCF7e"
          amount: "10000"
          payTo: "0x0000000000000000000000000000000000000001"
          maxTimeoutSeconds: 60
          description: Runtime smoke test
          mimeType: application/json
          extra:
            name: USDC
            version: "2"
